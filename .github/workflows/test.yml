name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # The Test Bench as other repos use it: its GitHub Action, on the valid sample messages.
      - uses: ./bench
        with:
          files: bench/samples/xml/*-valid.xml
